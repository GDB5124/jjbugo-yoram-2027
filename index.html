<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>2027학년도 학교요람 · 전주대학교사범대학부설고등학교</title>
<style>
  :root { --bg1:#1d2b3a; --bg2:#0b121a; --accent:#e0675e; --panel:#16212d; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    font-family: "Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background: radial-gradient(ellipse at 50% 40%, var(--bg1), var(--bg2) 78%);
    color:#e9eef3; overflow:hidden; display:flex; flex-direction:column;
    user-select:none; -webkit-user-select:none;
  }
  #sparkle { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; }
  header { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; gap:10px; position:relative; z-index:3000; }
  header h1 { font-size:17px; margin:0; font-weight:700; letter-spacing:-.3px; white-space:nowrap; }
  header h1 small { display:block; font-size:12px; font-weight:400; opacity:.65; }
  .tools { display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
  .sep { width:1px; height:22px; background:rgba(255,255,255,.15); margin:0 2px; }
  .btn {
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); color:#fff;
    height:36px; min-width:36px; padding:0 10px; border-radius:18px; cursor:pointer; font-size:14px; font-family:inherit;
    display:inline-flex; align-items:center; justify-content:center; gap:6px; text-decoration:none; transition:background .2s, border-color .2s;
  }
  .btn svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .btn:hover { background:rgba(255,255,255,.2); }
  .btn.on { background:var(--accent); border-color:var(--accent); }
  .btn:disabled { opacity:.3; cursor:default; }
  #zoomLabel { font-size:12px; min-width:40px; text-align:center; opacity:.8; font-variant-numeric:tabular-nums; }

  #stage { flex:1; position:relative; min-height:0; overflow:hidden; touch-action:none; z-index:1; }
  #zoomwrap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; transform-origin:0 0; perspective:1500px; }
  #zoomwrap.smooth { transition: transform .35s ease; }
  #stage.zoomed { cursor:grab; }
  #stage.panning { cursor:grabbing; }
  #tilt { transform-style:preserve-3d; }
  #tilt.intro { animation: intro 1.8s cubic-bezier(.2,.75,.2,1) both; }
  @keyframes intro {
    0%   { transform: translateY(90px) rotateX(55deg) rotateZ(-16deg) scale(.62); opacity:0; }
    35%  { opacity:1; }
    100% { transform: none; opacity:1; }
  }
  #book { position:relative; transition: transform .8s cubic-bezier(.45,.05,.25,1); }
  #book canvas { display:block; }
  #stage:not(.zoomed) #book { cursor:pointer; }
  #hot { position:absolute; display:none; }
  .hot { position:absolute; left:30.5%; width:44%; border-radius:4px; cursor:pointer; }
  .hot:hover { background:rgba(224,103,94,.16); box-shadow:inset 0 0 0 1.5px rgba(224,103,94,.55); }

  .nav-arrow { position:absolute; top:50%; transform:translateY(-50%); z-index:2000; width:52px; height:52px; border-radius:50%; font-size:26px; }
  #prev { left:18px; } #next { right:18px; }

  #toc {
    position:fixed; top:0; left:0; bottom:0; width:min(360px, 88vw); background:var(--panel); z-index:4000;
    transform:translateX(-102%); transition:transform .35s ease; box-shadow:8px 0 30px rgba(0,0,0,.4);
    display:flex; flex-direction:column;
  }
  #toc.open { transform:none; }
  #toc .head { display:flex; justify-content:space-between; align-items:center; padding:16px 18px; border-bottom:1px solid rgba(255,255,255,.08); }
  #toc .head b { font-size:16px; }
  #toc .list { overflow-y:auto; padding:8px 0 24px; }
  #toc .ch { padding:14px 18px 6px; font-size:13px; color:var(--accent); font-weight:700; cursor:pointer; }
  #toc .ch span { display:block; color:#cfd8e1; font-weight:400; font-size:12px; opacity:.75; margin-top:2px; }
  #toc .it { display:flex; justify-content:space-between; gap:10px; padding:7px 18px 7px 26px; font-size:14px; cursor:pointer; color:#dfe6ec; }
  #toc .it.sub { padding-left:40px; font-size:13px; opacity:.9; }
  #toc .it.grp { cursor:default; color:#fff; font-weight:600; }
  #toc .it:not(.grp):hover, #toc .it.cur { background:rgba(255,255,255,.07); }
  #toc .it.cur { box-shadow:inset 3px 0 0 var(--accent); }
  #toc .it em { font-style:normal; opacity:.55; font-variant-numeric:tabular-nums; }
  #dim { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:3500; opacity:0; pointer-events:none; transition:opacity .3s; }
  #dim.on { opacity:1; pointer-events:auto; }

  #toast {
    position:fixed; left:50%; bottom:120px; transform:translate(-50%, 20px); background:rgba(0,0,0,.8); color:#fff;
    padding:10px 18px; border-radius:20px; font-size:14px; opacity:0; transition:all .3s; pointer-events:none; z-index:5000;
  }
  #toast.on { opacity:1; transform:translate(-50%,0); }

  footer { padding:8px 16px 12px; display:flex; flex-direction:column; align-items:center; gap:8px; position:relative; z-index:3000; }
  #counter { font-size:14px; opacity:.85; font-variant-numeric:tabular-nums; }
  #slider { width:min(520px, 80vw); accent-color:var(--accent); }
  #thumbs { display:flex; gap:6px; overflow-x:auto; max-width:100%; padding:4px 4px 6px; scrollbar-width:thin; }
  #thumbs button { flex:0 0 auto; border:2px solid transparent; padding:0; background:none; cursor:pointer; border-radius:3px; opacity:.55; transition:all .2s; }
  #thumbs button.on { border-color:var(--accent); opacity:1; }
  #thumbs button:hover { opacity:1; }
  #thumbs img { height:54px; display:block; border-radius:2px; }
  .hint { font-size:12px; opacity:.5; text-align:center; }
  #autobar { position:absolute; left:0; top:0; height:3px; background:var(--accent); width:0; z-index:3001; }

  @media (max-width: 760px) {
    header { padding:8px 10px; }
    header h1 { font-size:14px; }
    header h1 small { display:none; }
    .btn { height:32px; min-width:32px; padding:0 7px; }
    .nav-arrow { width:40px; height:40px; font-size:22px; }
    #prev { left:6px; } #next { right:6px; }
    #thumbs, .hide-m, .sep { display:none; }
  }
</style>
</head>
<body>
<canvas id="sparkle"></canvas>
<header>
  <h1>2027학년도 학교요람<small>전주대학교사범대학부설고등학교</small></h1>
  <div class="tools">
    <button class="btn" id="tocBtn" title="목차"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="hide-m">목차</span></button>
    <span class="sep"></span>
    <button class="btn hide-m" id="zoomOut" title="축소 (-)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M21 21l-5-5"/></svg></button>
    <span id="zoomLabel" class="hide-m">100%</span>
    <button class="btn hide-m" id="zoomIn" title="확대 (+)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6M21 21l-5-5"/></svg></button>
    <span class="sep"></span>
    <button class="btn" id="autoBtn" title="자동 넘김"><svg viewBox="0 0 24 24" id="autoIcon"><path d="M7 5l12 7-12 7z"/></svg></button>
    <button class="btn" id="soundBtn" title="넘김 소리"><svg viewBox="0 0 24 24" id="soundIcon"></svg></button>
    <button class="btn" id="shareBtn" title="이 쪽 링크 공유"><svg viewBox="0 0 24 24"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg></button>
    <a class="btn hide-m" href="yoram-2027.pdf" download="2027학년도 학교요람.pdf" title="PDF 내려받기"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>PDF</a>
    <button class="btn" id="fs" title="전체 화면"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div id="autobar"></div>
</header>

<div id="stage">
  <div id="zoomwrap"><div id="tilt"><div id="book"><canvas id="cv"></canvas><div id="hot"></div></div></div></div>
  <button class="btn nav-arrow" id="prev" aria-label="이전 쪽">‹</button>
  <button class="btn nav-arrow" id="next" aria-label="다음 쪽">›</button>
</div>

<footer>
  <div id="counter"></div>
  <input type="range" id="slider" min="1" value="1" aria-label="쪽 이동">
  <div id="thumbs"></div>
  <div class="hint hide-m">종이를 잡고 끌어 넘기기 · 더블클릭/휠로 확대 · ← → 키</div>
</footer>

<div id="dim"></div>
<nav id="toc" aria-label="목차">
  <div class="head"><b>목차</b><button class="btn" id="tocClose" aria-label="닫기">✕</button></div>
  <div class="list" id="tocList"></div>
</nav>
<div id="toast"></div>

<script>
(() => {
  /* ===================== 설정 ===================== */
  const TOTAL = 32;
  const RATIO = 765.36 / 595.44;            // 쪽 세로/가로
  const params = new URLSearchParams(location.search);
  const AUTO_SEC = +params.get('auto') || 5;
  // 동작 줄이기 설정(Windows '애니메이션 효과' 끔 등)이면 배경 반짝이만 멈춤. 책 효과는 그대로.
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const NO_FX = params.get('fx') === 'off';
  const src  = n => `pages/p${String(n).padStart(2,'0')}.jpg`;
  const hsrc = n => `pages/hd/p${String(n).padStart(2,'0')}.jpg`;
  const tsrc = n => `pages/t${String(n).padStart(2,'0')}.jpg`;
  const PAPER = '#fbfaf6';

  // 목차 (2쪽 기준). y = 2쪽 그림(높이 1531px)에서 해당 줄의 세로 위치
  const TOC = [
    { ch:'Chapter 01 만남', title:'설레는 마음으로 꿈의 씨앗을 품다', page:4, y:338, items:[
      ['JJBUGO 비전 2030',4,380], ['전주사대부고 소명 10대 헌장',5,412], ['전북 미래학교',6,444], ['미션스쿨',7,476],
      ['2027학년도 입학생의 3개년 교육과정 편성표',8,508], ['2027 교육과정',10,540], ['디지털 선도학교',11,572] ]},
    { ch:'Chapter 02 성장', title:'사랑의 품 안에서 지성의 싹을 틔우다', page:12, y:625, items:[
      ['다양한 교과 체험 활동',null], ['국어과 – 2026 문학 기행',12,699,1], ['수학과 – 활동형 수학중점학교',13,731,1],
      ['영어과 – 국제교류 활동',14,763,1], ['과학과 – 과학중점학교',15,795,1], ['사회과 – 민주시민교육',16,827,1],
      ['창의적 특색 학교 프로그램',null], ['인성부 활동',17,899,1], ['학교 특색 프로그램',19,931,1], ['창체를 통한 동아리 활동',20,963,1] ]},
    { ch:'Chapter 03 동행', title:'서로의 손을 잡고 따뜻한 연대를 약속하다', page:23, y:1018, items:[
      ['동문대학생멘토링',23,1060], ['대학 탐방 및 전공 체험 활동',24,1092], ['진로비전캠프',24,1124],
      ['탐구심화활동',25,1156], ['입시연구모임',26,1188], ['전문적 학습공동체',27,1220] ]},
    { ch:'Chapter 04 도약', title:'세상의 중심에서 눈부신 미래를 꽃 피우다', page:28, y:1271, items:[
      ['최근 3개년 대입 진학 현황',28,1313], ['재학생들이 들려주는 우리학교 이야기',29,1345], ['학교시설과 아름다운 교정',30,1377] ]},
  ];
  const TOC_IMG_H = 1531;

  const $ = id => document.getElementById(id);
  const stage = $('stage'), wrap = $('zoomwrap'), tilt = $('tilt'), book = $('book'), cv = $('cv'), ctx = cv.getContext('2d'), hot = $('hot');
  const LEAVES = Math.ceil(TOTAL / 2);

  /* ===================== 상태 ===================== */
  let cur = 1;                 // 현재 쪽 (펼침 보기에서는 floor(cur/2)번째 펼침면)
  let single = false;          // 한 쪽 보기(모바일)
  let W = 0, H = 0, PAD = 0;   // 쪽 크기, 여백(그림자용)
  let cssW = 0, cssH = 0, S = 1;
  let zoom = 1, tx = 0, ty = 0;
  let T = null;                // 넘기는 중인 종이
  let sweep = null;            // 빛 스윕

  const exists = p => p >= 1 && p <= TOTAL;
  const spreadOf = p => Math.floor(p / 2);
  const ox = () => single ? PAD - W : PAD;   // 넘김 좌표 → 캔버스 좌표 x 이동량

  /* ===================== 그림 불러오기 ===================== */
  const imgs = {};
  function getImg(p) {
    if (!exists(p)) return null;
    let o = imgs[p];
    if (!o) { o = imgs[p] = { lo: new Image(), hi: null }; o.lo.onload = requestDraw; o.lo.src = src(p); }
    if (zoom > 1.3 && !o.hi) { o.hi = new Image(); o.hi.onload = requestDraw; o.hi.src = hsrc(p); }
    if (o.hi && o.hi.complete && o.hi.naturalWidth) return o.hi;
    if (o.lo.complete && o.lo.naturalWidth) return o.lo;
    return null;
  }
  function preload() { for (let p = cur - 5; p <= cur + 6; p++) getImg(p); }

  /* ===================== 크기 ===================== */
  function layout() {
    const sw = stage.clientWidth - (innerWidth > 760 ? 150 : 16);
    const sh = stage.clientHeight - 30;
    single = innerWidth <= 760 || innerWidth < innerHeight * 0.9;
    const across = single ? 1 : 2;
    W = Math.floor(Math.min(sw / (across + 0.12), (sh / 1.1) / RATIO));
    H = Math.round(W * RATIO);
    PAD = Math.round(H * 0.05);
    cssW = W * across + PAD * 2; cssH = H + PAD * 2;
    cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
    hot.style.left = PAD + 'px'; hot.style.top = PAD + 'px'; hot.style.width = W + 'px'; hot.style.height = H + 'px';
    T = null;
    zoom = 1; tx = ty = 0; applyZoom(false);
    resizeBacking();
    setShift(spreadOf(cur), false);
    updateUI();
  }
  function resizeBacking() {
    S = Math.min((devicePixelRatio || 1) * zoom, 5000 / cssW);
    cv.width = Math.round(cssW * S); cv.height = Math.round(cssH * S);
    requestDraw();
  }
  // 표지/뒤표지만 보일 때 책을 가운데로
  function setShift(s, animate = true) {
    let x = 0;
    if (!single) { if (s === 0) x = -W/2; else if (s === LEAVES) x = W/2; }
    if (!animate) book.style.transition = 'none';
    book.style.transform = `translateX(${x}px)`;
    if (!animate) { book.offsetHeight; book.style.transition = ''; }
  }

  /* ===================== 그리기 도구 ===================== */
  const clipPoly = (poly, f) => {
    const out = [];
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i+1) % poly.length], fa = f(a), fb = f(b);
      if (fa >= 0) out.push(a);
      if ((fa >= 0) !== (fb >= 0)) { const t = fa / (fa - fb); out.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }); }
    }
    return out;
  };
  const tracePoly = poly => { ctx.beginPath(); poly.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.closePath(); };

  // 한 쪽 그리기. side 'L' = 왼쪽(0~W), 'R' = 오른쪽(W~2W). flip = 좌우 반전
  function drawPage(p, side, flip, shadow) {
    if (!exists(p)) return;
    const x = side === 'L' ? 0 : W;
    if (shadow) {
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 28 * S; ctx.shadowOffsetY = 10 * S;
      ctx.fillStyle = PAPER; ctx.fillRect(x, 0, W, H); ctx.restore();
    }
    const im = getImg(p);
    ctx.save();
    if (flip) { ctx.translate(2*x + W, 0); ctx.scale(-1, 1); }
    if (im) ctx.drawImage(im, x, 0, W, H); else { ctx.fillStyle = PAPER; ctx.fillRect(x, 0, W, H); }
    ctx.restore();
    // 제본선 쪽 그늘
    const g = ctx.createLinearGradient(W, 0, side === 'L' ? 0 : 2*W, 0);
    g.addColorStop(0, 'rgba(0,0,0,.30)'); g.addColorStop(.05, 'rgba(0,0,0,.08)'); g.addColorStop(.13, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(x, 0, W, H);
  }

  // 종이 모서리 P가 갈 수 있는 범위 (찢어지지 않게)
  function constrain(P, cy) {
    const S1 = { x: W, y: cy };
    let d = Math.hypot(P.x - S1.x, P.y - S1.y);
    if (d > W) P = { x: S1.x + (P.x - S1.x) * W / d, y: S1.y + (P.y - S1.y) * W / d };
    const S2 = { x: W, y: H - cy }, D = Math.hypot(W, H);
    d = Math.hypot(P.x - S2.x, P.y - S2.y);
    if (d > D) P = { x: S2.x + (P.x - S2.x) * D / d, y: S2.y + (P.y - S2.y) * D / d };
    return P;
  }

  /* 넘기는 장면. 오른쪽 종이(F)를 접어 왼쪽으로 넘기는 상황으로 계산하고,
     뒤로 넘길 때는 화면 전체를 좌우로 뒤집어서 같은 계산을 씀 (mirror) */
  function drawTurn() {
    const { L, U, F, K, mirror, cy } = T;
    const P = T.P, C = { x: 2*W, y: cy };
    ctx.save();
    if (mirror) { ctx.translate(2*W, 0); ctx.scale(-1, 1); }
    if (L) drawPage(L, 'L', mirror, true);
    if (U) drawPage(U, 'R', mirror, true);

    const dx = C.x - P.x, dy = C.y - P.y, len = Math.hypot(dx, dy);
    if (len < 0.5) { drawPage(F, 'R', mirror, !U); ctx.restore(); return; }
    const n = { x: dx/len, y: dy/len }, M = { x: (C.x + P.x)/2, y: (C.y + P.y)/2 };
    const mn = M.x * n.x + M.y * n.y;
    const side = X => X.x * n.x + X.y * n.y - mn;              // > 0 이면 접힌 쪽
    const rect = [{x:W,y:0},{x:2*W,y:0},{x:2*W,y:H},{x:W,y:H}];
    const unfolded = clipPoly(rect, X => -side(X));
    const folded = clipPoly(rect, side);
    const refl = X => { const d = side(X); return { x: X.x - 2*d*n.x, y: X.y - 2*d*n.y }; };
    const flap = folded.map(refl);

    // 1) 드러난 아래쪽 위로 떨어지는 그림자
    if (folded.length > 2) {
      ctx.save(); tracePoly(folded); ctx.clip();
      const sw = Math.min(len * 0.45, W * 0.3);
      const g = ctx.createLinearGradient(M.x, M.y, M.x + n.x*sw, M.y + n.y*sw);
      g.addColorStop(0, `rgba(0,0,0,${U ? .5 : .0})`); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(W - 10, -10, W + 20, H + 20);
      ctx.restore();
    }
    // 2) 아직 접히지 않은 부분
    if (unfolded.length > 2) {
      if (!U) { ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 28*S; ctx.shadowOffsetY = 10*S; tracePoly(unfolded); ctx.fillStyle = PAPER; ctx.fill(); ctx.restore(); }
      ctx.save(); tracePoly(unfolded); ctx.clip();
      drawPage(F, 'R', mirror, false);
      const cw = Math.min(len * 0.3, W * 0.18);

    function loop(now) {
      g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
      g.globalCompositeOperation = 'lighter';
      for (const p of parts) {
        if (!REDUCED) { p.y -= p.vy; p.x += p.vx; if (p.y < -10) Object.assign(p, mk(false)); }
        const a = .25 + .75 * Math.max(0, Math.sin(now/1000 * p.sp + p.ph));
        const R = p.r * (p.star ? 3.2 : 2.4);
        const rg = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, R);
        rg.addColorStop(0, `rgba(${p.col},${.9*a})`); rg.addColorStop(1, `rgba(${p.col},0)`);
        g.fillStyle = rg; g.beginPath(); g.arc(p.x, p.y, R, 0, 6.29); g.fill();
        if (p.star && a > .5) {
          g.strokeStyle = `rgba(${p.col},${.5*a})`; g.lineWidth = .7;
          const L = R * 2.6;
          g.beginPath(); g.moveTo(p.x - L, p.y); g.lineTo(p.x + L, p.y); g.moveTo(p.x, p.y - L); g.lineTo(p.x, p.y + L); g.stroke();
        }
      }
      if (!document.hidden) requestAnimationFrame(loop);
    }
    size(); addEventListener('resize', size);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) requestAnimationFrame(loop); });
    requestAnimationFrame(loop);
  })();

  /* ===================== 키보드 · 기타 ===================== */
  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); next(); restartAuto(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); restartAuto(); }
    else if (e.key === 'Home') goPage(1);
    else if (e.key === 'End') goPage(TOTAL);
    else if (e.key === '+' || e.key === '=') setZoom(zoom * 1.4);
    else if (e.key === '-') setZoom(zoom / 1.4);
    else if (e.key === '0') setZoom(1);
    else if (e.key === 'Escape') { openToc(false); setZoom(1); }
  });
  $('fs').onclick = () => { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); };
  addEventListener('resize', layout);
  addEventListener('hashchange', () => { const p = parseInt(location.hash.slice(1)); if (p && !currentPages().includes(p)) goPage(p); });

  /* ===================== 시작 ===================== */
  const startPage = parseInt(location.hash.replace(/\D/g, ''));
  if (startPage >= 1) cur = Math.min(TOTAL, startPage);
  preload();
  layout();
  stopAuto(true);
  // 3D로 기울어진 책이 다가오는 등장 → 표지에 빛 스윕
  if (!NO_FX) {
    tilt.classList.add('intro');
    tilt.addEventListener('animationend', () => { tilt.classList.remove('intro'); startSweep(); }, { once: true });
  } else startSweep();
  if (params.has('auto')) startAuto();
})();
</script>
</body>
